name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Verify tag matches manifest
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  manifest_version="$(node -p 'JSON.parse(require("fs").readFileSync("manifest.json", "utf8")).version')"
                  if [ "$RELEASE_TAG" != "$manifest_version" ]; then
                    echo "Tag $RELEASE_TAG does not match manifest version $manifest_version."
                    exit 1
                  fi

            - name: Build plugin
              run: |
                  npm ci
                  npm run build
                  npm run lint
                  npm run check:release

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "$GITHUB_REF_NAME" \
                    --title="$GITHUB_REF_NAME" \
                    --draft \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
